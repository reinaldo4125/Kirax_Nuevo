<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <rect width="100" height="100" rx="20" fill="#06080f"/>
  <defs>
    <linearGradient id="kiraxFaviconGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A8" />
      <stop offset="45%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>
    <linearGradient id="kiraxFaviconEmerald" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="60%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#6EE7B7" />
    </linearGradient>
  </defs>

  <!-- Eagle Body & Left Wing Feathers -->
  <path
    d="M 50 84 L 44 66 L 18 30 C 31 41 40 51 48 56 C 43 45 34 34 26 18 C 39 29 48 40 52 48 L 52 26 C 56 20 63 23 66 28 L 60 35 C 66 33 71 37 69 43 C 65 52 58 66 50 84 Z"
    fill="url(#kiraxFaviconGold)"
  />

  <!-- Eye Sparkle -->
  <circle cx="60" cy="27" r="2.5" fill="#FFFFFF" />

  <!-- Ascending Trend Line Curve -->
  <path d="M 50 58 C 64 52 76 40 86 18" fill="none" stroke="url(#kiraxFaviconEmerald)" stroke-width="3.5" stroke-linecap="round" />

  <!-- Bullish Candlesticks Right Wing -->
  <g fill="url(#kiraxFaviconEmerald)">
    <!-- Candle 1 -->
    <line x1="59" y1="42" x2="59" y2="58" stroke="#10B981" stroke-width="1.5" />
    <rect x="57" y="46" width="4" height="10" rx="1" />

    <!-- Candle 2 -->
    <line x1="66" y1="32" x2="66" y2="52" stroke="#10B981" stroke-width="1.5" />
    <rect x="64" y="37" width="4" height="11" rx="1" />

    <!-- Candle 3 (Gold Accent Candle) -->
    <line x1="74" y1="22" x2="74" y2="44" stroke="#F59E0B" stroke-width="1.5" />
    <rect x="72" y="27" width="4.5" height="13" rx="1" fill="url(#kiraxFaviconGold)" />

    <!-- Candle 4 (Peak Golden Candle) -->
    <line x1="83" y1="10" x2="83" y2="34" stroke="#FFF" stroke-width="1.5" />
    <rect x="80.5" y="15" width="5" height="15" rx="1" fill="#FFE066" />
  </g>
</svg>
